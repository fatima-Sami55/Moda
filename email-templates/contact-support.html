<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>New Support Message Received - Moda</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@800;900&family=Roboto:wght@400;500;700&display=swap');
    </style>
  </head>
  <body style="margin: 0; padding: 0; background-color: #FFFAF0; font-family: 'Roboto', Helvetica, Arial, sans-serif; color: #1F1E23;">
    <table align="center" border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #FFFAF0; padding: 40px 10px;">
      <tr>
        <td align="center">
          <table border="0" cellpadding="0" cellspacing="0" width="600" style="background-color: #FFF5EA; border: 4px solid #1F1E23; box-shadow: 8px 8px 0px #1F1E23;">
            
            <!-- HEADER: Gradient Header with Moda Wordmark -->
            <tr>
              <td align="center" style="background: #FE672E; background: linear-gradient(135deg, #FE672E, #6A69FF); padding: 35px 20px; border-bottom: 4px solid #1F1E23;">
                <h1 style="margin: 0; font-family: 'Unbounded', sans-serif; font-size: 32px; font-weight: 900; letter-spacing: -0.04em; text-transform: uppercase; color: #1F1E23;">MODA</h1>
              </td>
            </tr>
            
            <!-- BODY: Content Area -->
            <tr>
              <td style="padding: 40px; text-align: left; vertical-align: top;">
                <h2 style="font-family: 'Unbounded', sans-serif; font-size: 20px; font-weight: 800; text-transform: uppercase; margin-top: 0; margin-bottom: 24px; color: #1F1E23;">New Support Message</h2>
                
                <table border="0" cellpadding="0" cellspacing="0" width="100%" style="font-family: 'Roboto', sans-serif; font-size: 15px; color: #1F1E23; line-height: 1.8; margin-bottom: 24px;">
                  <tr>
                    <td style="padding-bottom: 6px;"><strong>Sender Name:</strong> {{{senderName}}}</td>
                  </tr>
                  <tr>
                    <td style="padding-bottom: 6px;"><strong>Sender Email:</strong> <a href="mailto:{{{senderEmail}}}" style="color: #6A69FF; text-decoration: none;">{{{senderEmail}}}</a></td>
                  </tr>
                  <tr>
                    <td style="padding-bottom: 6px;"><strong>Subject:</strong> {{{subject}}}</td>
                  </tr>
                </table>
                
                <h4 style="font-family: 'Unbounded', sans-serif; font-size: 13px; font-weight: 800; text-transform: uppercase; margin-bottom: 10px; color: #1F1E23;">Message Content:</h4>
                <div style="background-color: #ffffff; padding: 24px; border: 2.5px solid #1F1E23; font-family: 'Roboto', sans-serif; font-size: 14px; line-height: 1.7; color: #4A494F; white-space: pre-wrap;">
                  {{{message}}}
                </div>
                
                <!-- NEUTRALLY STYLED ACCENT BAR -->
                <table border="0" cellpadding="0" cellspacing="0" width="100%" style="margin-top: 30px;">
                  <tr>
                    <td height="8" style="background-color: #FE672E; border: 2px solid #1F1E23;"></td>
                  </tr>
                </table>
              </td>
            </tr>
            
            <!-- FOOTER -->
            <tr>
              <td align="center" style="background-color: #FFF5EA; padding: 25px 20px; border-top: 4px solid #1F1E23;">
                <p style="margin: 0; font-family: 'Roboto', sans-serif; font-size: 12px; color: #4A494F; letter-spacing: 0.05em; font-weight: 500;">
                  &copy; 2026 Moda &middot; modashop.store
                </p>
              </td>
            </tr>
            
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
